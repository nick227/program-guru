                    $ref: '#/components/schemas/PaginatedMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token. Web clients send it as an httpOnly cookie; native clients as a Bearer header.
    adminAuth:
      type: http
      scheme: bearer
      description: Same session as bearerAuth; the handler also requires the MODERATOR or ADMIN role.
    adminOnlyAuth:
      type: http
      scheme: bearer
      description: Same session as bearerAuth; the handler also requires an active ADMIN (12-SOCIAL §7a).
  parameters:
    AdminUserFilter:
      in: query
      name: userId
      schema:
        type: string
        format: uuid
    AdminProgramFilter:
      in: query
      name: programId
      schema:
        type: string
        format: uuid
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque cursor returned by the previous page.
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      in: query
      name: q
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Simple text search within this resource.
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not visible to this viewer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State or version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PaginatedMeta:
      type: object
      required:
      - hasMore
      - nextCursor
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type:
          - string
          - 'null'
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    Visibility:
      type: string
      enum:
      - PRIVATE
      - UNLISTED
      - PUBLIC
    ProfileVisibility:
      type: string
      enum:
      - PUBLIC
      - PRIVATE
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - DEACTIVATED
    UserRole:
      type: string
      enum:
      - USER
      - MODERATOR
      - ADMIN
    FollowRelationship:
      type: string
      enum:
      - NONE
      - FOLLOWING
      - REQUESTED
      - INCOMING_REQUEST
    FollowRequestStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - DECLINED
      - CANCELLED
    ActivityStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - ARCHIVED
    ProgramStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - ARCHIVED
    AccessMode:
      type: string
      enum:
      - OPEN
      - APPROVAL
      - PAID
    ViewerAccess:
      type: string
      enum:
      - OWNER
      - GRANTED
      - PREVIEW
      - REQUESTED
      - LAPSED
    GenerationMode:
      type: string
      enum:
      - ALL_EACH_DAY
      - ROTATE
    FrequencyKind:
      type: string
      enum:
      - DAILY
      - WEEKDAYS
      - N_PER_WEEK
      - FLEXIBLE
      - CUSTOM
      - MONTHLY
    EnrollmentStatus:
      type: string
      enum:
      - PENDING_ACCESS
      - ACTIVE
      - PAUSED
      - COMPLETED
      - LEFT
    PriceKind:
      type: string
      enum:
      - ONE_TIME
      - MONTHLY
    ApprovalStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - DECLINED
      - CANCELLED
    PayoutStatus:
      type: string
      enum:
      - ONBOARDING
      - ACTIVE
      - RESTRICTED
    PurchaseStatus:
      type: string
      enum:
      - PENDING
      - PAID
      - REFUNDED
      - DISPUTED
    SubscriptionStatus:
      type: string
      enum:
      - INCOMPLETE
      - ACTIVE
      - PAST_DUE
      - CANCELED
      - EXPIRED
    MetricValueType:
      type: string
      enum:
      - INTEGER
      - DECIMAL
      - BOOLEAN
      - TEXT
      - DURATION
    MetricAggregation:
      type: string
      enum:
      - SUM
      - MAX
      - MIN
      - AVERAGE
      - LAST
      - COUNT
      - NONE
    MetricDirection:
      type: string
      enum:
      - HIGHER
      - LOWER
      - TARGET
      - NONE
    CalendarItemStatus:
      type: string
      description: NOT_PARTICIPATING marks items dated before the participant joined (show "Not participating",
        never "Missed"). Set by the server only.
      enum:
      - PLANNED
      - SKIPPED
      - CANCELLED
      - DONE
      - NOT_PARTICIPATING
    SessionStatus:
      type: string
      enum:
      - READY
      - ACTIVE
      - PAUSED
      - FINISHED
      - ABANDONED
    SessionAction:
      type: string
      enum:
      - START
      - PAUSE
      - RESUME
      - FINISH
      - ABANDON
    RecurrenceKind:
      type: string
      enum:
      - DAILY
      - WEEKDAYS
      - WEEKLY
      - EVERY_N_DAYS
      - MONTHLY
    RecurrenceStatus:
      type: string
      enum:
      - ACTIVE
      - ENDED
    RecurrenceScope:
      type: string
      enum:
      - THIS_ONE
      - THIS_AND_FUTURE
    GroupMode:
      type: string
      enum:
      - SYNC
      - ASYNC
    GroupRole:
      type: string
      enum:
      - OWNER
      - MEMBER
    GroupMemberStatus:
      type: string
      enum:
      - INVITED
      - ACTIVE
      - LEFT
      - REMOVED
    InviteKind:
      type: string
      enum:
      - USER
      - EMAIL
      - LINK
    InviteStatus:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - DECLINED
      - REVOKED
      - EXPIRED
    MemberDayStatus:
      type: string
      description: NOT_PARTICIPATING when the occurrence is dated before that member joined; excluded from
        finishedCount and totalCount.
        IN_PROGRESS when the member started a session for this occurrence and shares completion; it never
        means they are online now.
      enum:
      - DONE
      - IN_PROGRESS
      - PENDING
      - UNKNOWN
      - NOT_PARTICIPATING
    MediaType:
      type: string
      enum:
      - PHOTO
      - VIDEO
      - AUDIO
    MediaState:
      type: string
      enum:
      - UPLOADING
      - PROCESSING
      - READY
      - FAILED
      - BLOCKED
    MediaPurpose:
      type: string
      enum:
      - COVER
      - DEMONSTRATION
      - ILLUSTRATION
      - JOURNAL
      - AVATAR
      - OTHER
    MediaAudience:
      type: string
      enum:
      - PUBLIC
      - GROUP
    PublicationStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - REVOKED
    AttachmentTargetKind:
      type: string
      enum:
      - PROGRAM
      - ACTIVITY_REVISION
      - INSTRUCTION
      - RESULT_ENTRY
      - PROFILE
    NotificationType:
      type: string
      enum:
      - ACTIVITY_REMINDER
      - DAILY_SUMMARY
      - FOLLOW_REQUEST
      - FOLLOW_ACCEPTED
      - GROUP_INVITE
      - MEMBER_JOINED
      - COMPLETION_SHARED
      - COMPLETION_REACTION
      - GROUP_MEDIA_SHARED
      - GROUP_MEDIA_COMMENT
      - CONTRIBUTION_APPROVED
      - PROGRAM_ACCESS
      - PROGRAM_UPDATE
      - ACHIEVEMENT_EARNED
      - PAYMENT_ISSUE
    ReportTargetType:
      type: string
      enum:
      - PROGRAM
      - ACTIVITY
      - MEDIA
      - COMMENT
      - USER
    ReportReason:
      type: string
      enum:
      - HARASSMENT
      - PRIVACY
      - COPYRIGHT
      - MISLEADING
      - UNSAFE
      - OTHER
    ReportStatus:
      type: string
      enum:
      - OPEN
      - RESOLVED
      - DISMISSED
    ModerationActionKind:
      type: string
      enum:
      - HIDE
      - RESTORE
      - UNLIST
      - RESTRICT_PUBLISHING
      - SUSPEND_USER
      - REVOKE_ACCESS
    DiscoverKind:
      type: string
      enum:
      - PROGRAM
      - ACTIVITY
      - CREATOR
    DiscoverSort:
      type: string
      enum:
      - RELEVANT
      - NEW
      - POPULAR
    ActivitySource:
      type: string
      enum:
      - PLATFORM
      - MINE
      - PUBLIC
    LeaveFutureItems:
      type: string
      enum:
      - REMOVE
      - KEEP_STANDALONE
    UserSummary:
      type: object
      required:
      - id
      - handle
      - displayName
      - avatarUrl
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
    FocusChip:
      type: object
      required:
      - id
      - label
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
    UserProfile:
      type: object
      description: focusChips are derived from published Programs.
      required:
      - id
      - handle
      - displayName
      - avatarUrl
      - bio
      - coverUrl
      - visibility
      - relationship
      - followerCount
      - followingCount
      - publicProgramCount
      - focusChips
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        coverUrl:
          type:
          - string
          - 'null'
        visibility:
          $ref: '#/components/schemas/ProfileVisibility'
        relationship:
          $ref: '#/components/schemas/FollowRelationship'
        followerCount:
          type: integer
        followingCount:
          type: integer
        publicProgramCount:
          type: integer
        focusChips:
          type: array
          items:
            $ref: '#/components/schemas/FocusChip'
    NotificationPrefs:
      type: object
      required:
      - inAppReminders
      - dailyEmail
      - dailyReminderTime
      - groupActivity
      - followRequests
      - mutedGroupIds
      properties:
        inAppReminders:
          type: boolean
        dailyEmail:
          type: boolean
        dailyReminderTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        groupActivity:
          type: boolean
        followRequests:
          type: boolean
        mutedGroupIds:
          type: array
          items:
            type: string
            format: uuid
    UserPreferences:
      type: object
      required:
      - timezone
      - locale
      - defaultVisibility
      - notifications
      properties:
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
        defaultVisibility:
          $ref: '#/components/schemas/Visibility'
        notifications:
          $ref: '#/components/schemas/NotificationPrefs'
    UserMe:
      type: object
      required:
      - id
      - email
      - emailVerified
      - emailVerificationRequired
      - status
      - role
      - profile
      - preferences
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        emailVerified:
          type: boolean
        emailVerificationRequired:
          type: boolean
          description: Whether an unverified address is currently held back from publishing and payouts
            (REQUIRE_EMAIL_VERIFICATION). When false, show confirmation as optional.
        status:
          $ref: '#/components/schemas/UserStatus'
        role:
          $ref: '#/components/schemas/UserRole'
        profile:
          $ref: '#/components/schemas/UserProfile'
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        createdAt:
          type: string
          format: date-time
    RegisterInput:
      type: object
      required:
      - email
      - password
      - handle
      - displayName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 200
        handle:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{2,29}$
          description: Case-insensitive; stored and returned in lowercase.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
