openapi: 3.1.0
info:
  title: Programs App API
  version: 0.1.0
  description: 'Implements docs/specs. Write this file first: Fastify routes from it and the SDK types are generated
    from it. Routes with `security: []` are public; handlers resolve an optional viewer from the session cookie
    so responses can reflect the viewer.'
servers:
- url: http://localhost:3001
  description: Local dev
security:
- bearerAuth: []
tags:
- name: auth
  description: Sessions and credentials
- name: users
  description: Profiles, preferences, follows, blocks
- name: catalog
  description: Categories, types, focus, metrics, tools
- name: activities
  description: Reusable Activities and Instructions
- name: programs
  description: Authoring, schedules, publishing, enrollment, access
- name: billing
  description: Payouts, checkout, subscriptions, webhooks
- name: calendar
  description: Personal calendar, standalone and recurring entries
- name: sessions
  description: Per-Activity execution and results
- name: achievements
  description: Milestones derived from completions
- name: groups
  description: Program groups, invites, shared completion, reactions
- name: media
  description: Assets, uploads, attachments, publications, contributions
- name: social
  description: Discovery, creator pages, likes, group media comments
- name: notifications
  description: In-app notifications and email preferences
- name: moderation
  description: Reports and moderator actions
- name: admin
  description: Platform administration (ADMIN only)
paths:
  /me/program-library:
    get:
      summary: List personal Program management projections
      operationId: getPersonalProgramLibrary
      tags:
        - programs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonalProgram'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/program-library/{programId}:
    post:
      summary: Archive, restore or restart a personal Program
      operationId: managePersonalProgram
      tags:
        - programs
      security:
        - bearerAuth: []
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - ARCHIVE
                    - RESTORE
                    - RESTART
                expectedRunId:
                  type: string
                  format: uuid
                  description: Required for restart; rejects retries against a superseded run.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PersonalProgram'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/register:
    post:
      operationId: register
      summary: Register
      tags:
      - auth
      description: Creates user, profile, preferences, credential, and default calendar in one transaction. Session
        delivered by Set-Cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserMe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: login
      summary: Login
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserMe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/google:
    post:
      operationId: loginWithGoogle
      summary: Login with google
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserMe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: Logout
      tags:
      - auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user
      tags:
