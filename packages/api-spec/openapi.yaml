        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAdminUser
      summary: Change an account's role or status
      tags:
      - admin
      description: Audited. Suspending signs the account out. The last active ADMIN cannot be demoted or suspended (409).
      security:
      - adminOnlyAuth: []
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
