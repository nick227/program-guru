  /users/me/group-invitations:
    get:
      operationId: listMyGroupInvitations
      summary: List group invitations addressed to me
      tags:
      - groups
      description: Pending, unexpired USER invitations and EMAIL invitations to the viewer's verified address,
        newest first, each with its join state.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReceivedGroupInvitation'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/group-invitations/{invitationId}/accept:
    post:
      operationId: acceptMyGroupInvitation
      summary: Accept a group invitation addressed to me
      tags:
      - groups
      description: Same rules as acceptGroupInvitation, addressed by invitation id instead of token.
      parameters:
      - in: path
        name: invitationId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptGroupInvitationInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/GroupDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
