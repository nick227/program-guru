        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify email
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
