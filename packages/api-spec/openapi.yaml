          - UNLIST
          - RESTRICT_PUBLISHING
          - SUSPEND_USER
          - REVOKE_ACCESS
          - ROLE_CHANGE
          - PUBLISH
          - ARCHIVE
          - DELETE
        reason:
          type: string
        reportId:
