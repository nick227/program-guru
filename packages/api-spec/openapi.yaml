                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminContentItem'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/content/import:
    post:
      operationId: importAdminContent
      summary: Import platform Programs with nested Activities
      tags:
      - admin
      description: With dryRun, validates the whole batch and returns every issue without writing. Otherwise
        writes all Programs as platform drafts in one transaction, or nothing, and returns 400 with fieldErrors
        keyed by JSON path when anything is invalid. A replayed idempotencyKey returns the original result.
      security:
      - adminOnlyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminImportInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AdminImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/content/{kind}/{id}/moderation:
