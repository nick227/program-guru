  /catalog/focuses:
    get:
      operationId: listFocuses
      summary: List focuses
      tags:
      - catalog
      security: []
      parameters:
      - in: query
        name: categoryId
        schema:
          type: string
          format: uuid
      - in: query
        name: programTypeId
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
