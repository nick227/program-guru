name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4.13  # matches Railway template image mysql:8 (resolves to 8.4.13)
        env:
          MYSQL_ROOT_PASSWORD: test_secret
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:test_secret@127.0.0.1:3306/testdb
      TEST_DATABASE_URL: mysql://root:test_secret@127.0.0.1:3306/testdb
      SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; also pinning it here fails the action.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install ffmpeg (worker media pipeline tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @project/db generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Generate SDK
        run: pnpm sdk:generate

      - name: Check SDK drift
        run: pnpm sdk:check

      - name: Apply DB migrations
        run: pnpm db:deploy

      - name: Test
        run: pnpm test

      - name: Production build (bundle must start without workspace TypeScript)
        run: pnpm --filter server build
