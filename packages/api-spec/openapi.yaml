  /media-files/{mediaId}/{variant}:
    get:
      operationId: getMediaFile
      summary: Get a media file
      tags:
      - media
      security: []
      description: Signed delivery URL with origin authorization rechecked on each fetch. Optional viewerId and publicationId are signature-bound; clients must use the URL unchanged. Streams both local and remote objects without cacheable redirects.
      parameters:
      - in: path
        name: mediaId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: variant
        required: true
        schema:
          type: string
          enum:
          - thumb
          - poster
          - stream
          - original
      - in: query
        name: exp
        required: true
        schema:
          type: integer
      - in: query
        name: sig
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: viewerId
        schema: { type: string, format: uuid }
      - in: query
        name: publicationId
        schema: { type: string, format: uuid }
      - in: header
        name: range
        required: false
        schema:
          type: string
        description: Optional single byte range, e.g. `bytes=0-1023`.
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 'Partial content for a `Range: bytes=start-end` request (media playback and seeking)'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '416':
          description: Requested range not satisfiable
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
